[tools]
rust = { version = "1.99.1", components = "clippy,rustfmt,llvm-tools" }
"aqua:taiki-e/cargo-llvm-cov" = "0.9.1"
cargo-deny = "0.20.2"

[tasks.test]
description = "Run the test suite (the end-to-end tests need python3 and ssh-keygen)"
run = "cargo test --workspace"

[tasks.test-thorough]
description = "Run the test suite with many more property-test cases"
env = { PROPTEST_CASES = "5000" }
run = "cargo test --workspace"

[tasks.lint]
description = "Lint and check formatting"
run = [
  "cargo clippy --workspace --all-targets -- -D warnings",
  "cargo fmt --all --check",
]

[tasks.fmt]
description = "Apply formatting"
run = "cargo fmt --all"

[tasks.install]
description = "Install amoeboid and amoeboid-daemon into ~/.cargo/bin, then restart the runtime"
run = [
  "cargo install --locked --path crates/amoeboid-cli",
  "cargo install --locked --path crates/amoeboid-daemon",
  "systemctl --user try-restart amoeboid.service",
]

[tasks.cov]
description = "Branch coverage; fails under 100 % for pure modules"
# --branch needs -Z coverage-options=branch; RUSTC_BOOTSTRAP lets the pinned stable accept it.
env = { RUSTC_BOOTSTRAP = "1" }
run = [
  "cargo llvm-cov clean --workspace",
  "cargo llvm-cov --workspace --branch --no-report",
  "cargo llvm-cov report --branch --summary-only",
  "cargo llvm-cov report --branch --json --summary-only --output-path target/llvm-cov.json",
  "mise run cov-gate",
]

# Claude Code refuses jq's file-reading flags whatever the allow rules say, so the gate is
# reachable through `mise run`.
[tasks.cov-gate]
description = "Apply the pure-module branch gate to an llvm-cov JSON report"
usage = 'arg "[report]" default="target/llvm-cov.json" help="cargo llvm-cov report --json output"'
run = 'jq -r -f tools/cov-gate.jq "$usage_report"'

[tasks.deny]
description = "Check the dependency graph against deny.toml (crates, licences, sources)"
run = "cargo deny check"
