[workspace]
resolver = "3"
members = ["crates/amoeboid", "crates/amoeboid-daemon", "crates/amoeboid-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"

[workspace.dependencies]
amoeboid = { path = "crates/amoeboid", version = "0.1.0" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
string_slice = "deny"
wildcard_enum_match_arm = "deny"
dbg_macro = "deny"
exit = "deny"
print_stdout = "deny"
print_stderr = "deny"
pedantic = { level = "warn", priority = -1 }

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
