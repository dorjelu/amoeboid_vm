[package]
name = "amoeboid"
description = "Control plane for NixOS microVMs running coding agents against chosen host directories"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
ractor = "0.16.5"
ractor-supervisor = { version = "0.2.0", default-features = false }
rustix = { version = "1.1.6", features = ["fs", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "io-util", "time", "macros", "sync"] }
tokio-rusqlite = { version = "0.8.0", features = ["bundled"] }
tracing = "0.1.44"
uuid = { version = "1.29.0", features = ["v7", "serde"] }

[lints]
workspace = true

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["test-util"] }
